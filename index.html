<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>快閃糾團</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0 16px}
.header h1{font-size:22px;font-weight:700;color:#e74c3c}
.header .event-name{font-size:16px;color:#666;margin-top:4px}
.header .admin-link{font-size:12px;color:#999;margin-top:8px}
.header .admin-link a{color:#999}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.card h2{font-size:16px;font-weight:600;margin-bottom:12px;color:#333;border-bottom:2px solid #e74c3c;padding-bottom:8px}
.item-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.item-row:last-child{border-bottom:none}
.item-check{width:20px;height:20px;margin-right:10px;accent-color:#e74c3c;cursor:pointer}
.item-info{flex:1}
.item-name{font-size:15px;font-weight:500}
.item-price{font-size:13px;color:#e74c3c;font-weight:600}
.item-remain{font-size:12px;color:#999;margin-top:2px}
.item-remain.soldout{color:#e74c3c;font-weight:600}
.qty-wrap{display:flex;align-items:center;gap:4px}
.qty-wrap button{width:28px;height:28px;border-radius:6px;border:1px solid #ddd;background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#333}
.qty-wrap button:disabled{background:#f0f0f0;color:#ccc;cursor:not-allowed}
.qty-wrap button:active{background:#f0f0f0}
.qty-wrap span{width:28px;text-align:center;font-size:15px;font-weight:600}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:13px;color:#666;margin-bottom:4px;font-weight:500}
.input-group input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none;transition:border-color 0.2s}
.input-group input:focus{border-color:#e74c3c}
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:2px solid #f0f0f0;margin-top:8px}
.total-bar .label{font-size:14px;color:#666}
.total-bar .amount{font-size:20px;font-weight:700;color:#e74c3c}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-primary{background:#e74c3c;color:#fff}
.btn-primary:active{background:#c0392b}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-sm{width:auto;padding:6px 14px;font-size:13px;border-radius:6px;display:inline-block;border:none;cursor:pointer;font-weight:600}
.btn-edit{background:#fff;color:#2980b9;border:1px solid #2980b9}
.btn-del{background:#fff;color:#e74c3c;border:1px solid #e74c3c;margin-left:6px}
.btn-sm:disabled{background:#f0f0f0;color:#ccc;border-color:#ddd;cursor:not-allowed}
.orders-section{margin-top:16px}
.order-item{padding:10px 0;border-bottom:1px solid #f0f0f0}
.order-item:last-child{border-bottom:none}
.order-name{font-weight:600;font-size:14px;color:#333;display:flex;align-items:center;justify-content:space-between}
.order-detail{font-size:13px;color:#666;margin-top:2px;line-height:1.5}
.order-total{font-size:13px;color:#e74c3c;font-weight:600;margin-top:2px}
.order-paid{display:inline-block;font-size:11px;background:#27ae60;color:#fff;padding:2px 6px;border-radius:4px;margin-left:6px}
.order-actions{margin-top:8px;text-align:right}
.edit-remain{font-size:11px;color:#999;margin-right:6px}
.empty{text-align:center;padding:24px;color:#999;font-size:14px}
.loading{text-align:center;padding:40px;color:#999}
.deadline-bar{font-size:13px;margin-top:6px;padding:4px 12px;border-radius:6px;display:inline-block}
.deadline-bar.active{background:#fff3cd;color:#856404}
.deadline-bar.expired{background:#f8d7da;color:#721c24}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:opacity 0.3s;z-index:100}
.toast.show{opacity:1}
.edit-form{margin-top:8px;padding:10px;background:#f9f9f9;border-radius:8px}
.edit-form .row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.edit-form .row:last-child{margin-bottom:0}
.edit-form select{flex:1;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.edit-form input{width:70px;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;text-align:center}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:12px;padding:20px;margin:16px;max-width:420px;width:100%;text-align:center}
.modal-box h3{margin-bottom:12px}
.modal-box p{font-size:14px;color:#666;margin-bottom:16px;line-height:1.6}
.modal-box .btn{margin-bottom:8px}
.modal-box .btn:last-child{margin-bottom:0}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">載入中...</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script type="module">
import { db } from "./firebase-config.js";
import { calculateRemaining, validateOrderQty, applyOrderCounters, releaseOrderCounters } from "./lib/quantity.js";
import { buildOrderKey } from "./lib/orderKey.js";

let currentUser = null;
let currentEventId = null;
let eventData = null;
let items = [];
let counters = {};        // { itemId: sold, __total: sold, __orders: 訂單數 }
let selected = {};        // { itemId: qty }
let myOrders = [];        // 本人訂單

const app = document.getElementById("app");

async function init() {
  try {
    const auth = firebase.auth();
    const cred = await auth.signInAnonymously();
    currentUser = cred.user;
    const params = new URLSearchParams(window.location.search);
    const shareCode = params.get("id");
    if (!shareCode) {
      renderHome();
    } else {
      await loadEvent(shareCode);
    }
  } catch (e) {
    document.getElementById("loading").innerHTML = "初始化失敗：" + e.message;
  }
}

function renderHome() {
  app.innerHTML = `
    <div class="header"><h1>快閃糾團</h1></div>
    <div class="card"><div class="empty">請透過管理者分享的連結開啟此頁</div></div>
  `;
}

async function loadEvent(shareCode) {
  const loading = document.getElementById("loading");
  try {
    const q = await db.collection("fgq_events").where("shareCode", "==", shareCode.toUpperCase()).limit(1).get();
    if (q.empty) {
      // 試試直接以 eventId 讀取
      const doc = await db.collection("fgq_events").doc(shareCode).get();
      if (!doc.exists) { loading.innerHTML = "找不到此活動"; return; }
      currentEventId = doc.id;
      eventData = doc.data();
    } else {
      currentEventId = q.docs[0].id;
      eventData = q.docs[0].data();
    }
    document.title = eventData.name + " - 快閃糾團";
    await Promise.all([loadItems(), loadCounters(), listenOrders()]);
    render();
  } catch (e) {
    loading.innerHTML = "載入失敗：" + e.message;
  }
}

async function loadItems() {
  const snap = await db.collection("fgq_events").doc(currentEventId).collection("items").get();
  items = [];
  snap.forEach(d => items.push({ id: d.id, ...d.data() }));
}

async function loadCounters() {
  counters = {};
  const snap = await db.collection("fgq_events").doc(currentEventId).collection("counters").get();
  snap.forEach(d => { counters[d.id] = d.data().sold || 0; });
  if (counters.__total === undefined) counters.__total = 0;
  if (counters.__orders === undefined) counters.__orders = 0;
  items.forEach(it => { if (counters[it.id] === undefined) counters[it.id] = 0; });
}

function render() {
  const deadlinePassed = eventData.deadline && eventData.deadline.toDate() < new Date();
  const deadlineBar = eventData.deadline
    ? `<div class="deadline-bar ${deadlinePassed ? 'expired' : 'active'}">${deadlinePassed ? '已收單（截止：' : '收單截止：'}${eventData.deadline.toDate().toLocaleString("zh-TW", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}${deadlinePassed ? '）' : ''}</div>`
    : "";

  const itemsHtml = items.map(it => {
    const limit = it.limit || 0;
    const sold = counters[it.id] || 0;
    const remain = calculateRemaining(limit, sold);
    const soldout = limit && remain <= 0;
    const remainTxt = !limit ? "不限量" : (soldout ? "已售完" : "剩餘 " + remain + " 份");
    const maxReached = limit && (selected[it.id] || 0) >= remain;
    return `
      <div class="item-row">
        <input type="checkbox" class="item-check" data-id="${it.id}" ${soldout || deadlinePassed ? 'disabled' : ''} ${selected[it.id] ? 'checked' : ''} onchange="window._sel('${it.id}', this.checked)">
        <div class="item-info">
          <div class="item-name">${esc(it.name)}</div>
          <div class="item-price">$${it.price}</div>
          <div class="item-remain ${soldout ? 'soldout' : ''}">${remainTxt}</div>
        </div>
        <div class="qty-wrap">
          <button ${soldout || deadlinePassed || (selected[it.id] || 0) <= 0 ? 'disabled' : ''} onclick="window._qty('${it.id}',-1)">-</button>
          <span id="qty-${it.id}">${selected[it.id] || 0}</span>
          <button ${soldout || deadlinePassed || maxReached ? 'disabled' : ''} onclick="window._qty('${it.id}',1)">+</button>
        </div>
      </div>`;
  }).join("") || '<div class="empty">管理者尚未新增品項</div>';

  const subtotal = Object.entries(selected).reduce((s, [id, q]) => {
    const it = items.find(i => i.id === id);
    return it ? s + it.price * q : s;
  }, 0);

  app.innerHTML = `
    <div class="header">
      <h1>快閃糾團</h1>
      <div class="event-name">${esc(eventData.name)}</div>
      ${deadlineBar}
    </div>

    <div class="card" id="orderForm" ${deadlinePassed ? 'style="display:none"' : ''}>
      <h2>選購品項</h2>
      <div id="itemsList">${itemsHtml}</div>
      <div class="total-bar">
        <span class="label">小計</span>
        <span class="amount" id="subtotal">$${subtotal}</span>
      </div>
      <div style="margin-top:16px">
        <div class="input-group">
          <label>你的名字</label>
          <input type="text" id="buyerName" placeholder="輸入你的名字" maxlength="20">
        </div>
        <div class="input-group">
          <label>手機後三碼（取貨/對帳用）</label>
          <input type="text" id="phoneLast3" placeholder="例：123" maxlength="3" inputmode="numeric" pattern="[0-9]{3}">
        </div>
        <button class="btn btn-primary" id="submitBtn" onclick="window._submit()">送出訂單</button>
      </div>
    </div>

    <div class="card orders-section">
      <h2>我的訂單</h2>
      <div id="myOrdersList">${renderMyOrders()}</div>
    </div>

    <div class="card orders-section">
      <h2>下單統計</h2>
      <div id="statsList">${renderStats()}</div>
    </div>
  `;
}

function renderStats() {
  const orders = counters.__orders || 0;
  const totalQty = counters.__total || 0;
  return `
    <div style="display:flex;gap:12px;text-align:center">
      <div style="flex:1;padding:12px;background:#fff1f0;border-radius:10px">
        <div style="font-size:26px;font-weight:700;color:#e74c3c">${orders}</div>
        <div style="font-size:12px;color:#666;margin-top:2px">張訂單</div>
      </div>
      <div style="flex:1;padding:12px;background:#fff1f0;border-radius:10px">
        <div style="font-size:26px;font-weight:700;color:#e74c3c">${totalQty}</div>
        <div style="font-size:12px;color:#666;margin-top:2px">份商品</div>
      </div>
    </div>
    <div style="font-size:11px;color:#999;margin-top:8px">此數據僅供參考，實際以主辦單位帳目為準。</div>`;
}

function renderMyOrders() {
  if (myOrders.length === 0) return '<div class="empty">你還沒有訂單</div>';
  return myOrders.map(o => {
    const detail = o.items.map(i => i.name + " x" + i.qty + " ($" + i.price * i.qty + ")").join("、");
    return `
      <div class="order-item">
        <div class="order-name">
          <span>${esc(o.buyerName)}${o.isPaid ? '<span class="order-paid">已收款</span>' : ''}</span>
        </div>
        <div class="order-detail">${esc(detail)}</div>
        <div class="order-total">合計 $${o.totalPrice}</div>
        <div class="order-actions">
          <button class="btn-sm btn-del" data-key="${esc(o.id)}" onclick="window._cancelOrder(this.getAttribute('data-key'))">取消</button>
        </div>
      </div>`;
  }).join("");
}

async function listenOrders() {
  db.collection("fgq_events").doc(currentEventId).collection("orders")
    .where("createdBy", "==", currentUser.uid)
    .onSnapshot(snap => {
      myOrders = [];
      snap.forEach(d => myOrders.push({ id: d.id, ...d.data() }));
      const el = document.getElementById("myOrdersList");
      if (el) el.innerHTML = renderMyOrders();
    }, err => console.error(err));

  // 統計（訂單數、總數量）與剩餘名額即時更新：用 snapshot 資料更新 counters 並重繪
  db.collection("fgq_events").doc(currentEventId).collection("counters")
    .onSnapshot(snap => {
      snap.forEach(d => { counters[d.id] = d.data().sold || 0; });
      if (counters.__total === undefined) counters.__total = 0;
      if (counters.__orders === undefined) counters.__orders = 0;
      items.forEach(it => { if (counters[it.id] === undefined) counters[it.id] = 0; });
      const el = document.getElementById("statsList");
      if (el) el.innerHTML = renderStats();
      renderItemsList();
    }, err => console.error(err));
}

// 重繪品項清單（剩餘名額、售完禁用、+ 上限）但不動整頁
function renderItemsList() {
  const el = document.getElementById("itemsList");
  if (!el) return;
  const deadlinePassed = eventData.deadline && eventData.deadline.toDate() < new Date();
  el.innerHTML = items.map(it => {
    const limit = it.limit || 0;
    const sold = counters[it.id] || 0;
    const remain = calculateRemaining(limit, sold);
    const soldout = limit && remain <= 0;
    const remainTxt = !limit ? "不限量" : (soldout ? "已售完" : "剩餘 " + remain + " 份");
    const maxReached = limit && (selected[it.id] || 0) >= remain;
    return `
      <div class="item-row">
        <input type="checkbox" class="item-check" data-id="${it.id}" ${soldout || deadlinePassed ? 'disabled' : ''} ${selected[it.id] ? 'checked' : ''} onchange="window._sel('${it.id}', this.checked)">
        <div class="item-info">
          <div class="item-name">${esc(it.name)}</div>
          <div class="item-price">$${it.price}</div>
          <div class="item-remain ${soldout ? 'soldout' : ''}">${remainTxt}</div>
        </div>
        <div class="qty-wrap">
          <button ${soldout || deadlinePassed || (selected[it.id] || 0) <= 0 ? 'disabled' : ''} onclick="window._qty('${it.id}',-1)">-</button>
          <span id="qty-${it.id}">${selected[it.id] || 0}</span>
          <button ${soldout || deadlinePassed || maxReached ? 'disabled' : ''} onclick="window._qty('${it.id}',1)">+</button>
        </div>
      </div>`;
  }).join("") || '<div class="empty">管理者尚未新增品項</div>';
}

// 全域函式（onclick 需掛 window）
window._sel = function(id, checked) {
  const it = items.find(i => i.id === id);
  if (checked) {
    if (!it) return;
    const limit = it.limit || 0;
    const sold = counters[id] || 0;
    const remain = calculateRemaining(limit, sold);
    if (limit && remain <= 0) { showToast("此品項已售完"); return; }
    if (!selected[id]) selected[id] = 1;
  } else {
    selected[id] = 0;
  }
  renderItemsList();
  updateTotal();
};

window._qty = function(id, delta) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  const limit = it.limit || 0;
  const sold = counters[id] || 0;
  const max = limit ? (limit - sold) : 9999;
  selected[id] = Math.max(0, Math.min((selected[id] || 0) + delta, max));
  renderItemsList();
  updateTotal();
};

function updateTotal() {
  const total = Object.entries(selected).reduce((s, [id, q]) => {
    const it = items.find(i => i.id === id);
    return it ? s + it.price * q : s;
  }, 0);
  const el = document.getElementById("subtotal");
  if (el) el.textContent = "$" + total;
}

window._submit = async function() {
  const name = document.getElementById("buyerName").value.trim();
  const phone = document.getElementById("phoneLast3").value.trim();
  if (!name) { showToast("請輸入你的名字"); return; }
  if (!/^\d{3}$/.test(phone)) { showToast("請輸入 3 位數字手機後三碼"); return; }

  const orderItems = Object.entries(selected)
    .filter(([id, q]) => q > 0)
    .map(([id, q]) => {
      const it = items.find(i => i.id === id);
      return { itemId: it.id, name: it.name, price: it.price, qty: q };
    });
  if (orderItems.length === 0) { showToast("請至少選一項商品"); return; }

  const totalPrice = orderItems.reduce((s, i) => s + i.price * i.qty, 0);
  const limits = {};
  items.forEach(it => { limits[it.id] = it.limit || 0; });

  // 訂單 id = (後三碼 + 姓名) 推導鍵，同活動內同組合唯一
  const orderKey = buildOrderKey(phone, name);

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "送出中...";
  try {
    await db.runTransaction(async tx => {
      // 重新讀計數器
      const counterSnap = {};
      for (const key of ["__total", "__orders", ...items.map(i => i.id)]) {
        const ref = db.collection("fgq_events").doc(currentEventId).collection("counters").doc(key);
        const snap = await tx.get(ref);
        counterSnap[key] = snap.exists ? (snap.data().sold || 0) : 0;
      }
      const check = validateOrderQty(orderItems, counterSnap, limits);
      if (!check.ok) throw new Error("部分品項數量不足");

      const orderRef = db.collection("fgq_events").doc(currentEventId).collection("orders").doc(orderKey);
      // 同組合已存在即拒絕（訂單已存在 → 寫入目標已存在，規則會擋 create）
      const orderSnap = await tx.get(orderRef);
      if (orderSnap.exists) {
        throw new Error("這個姓名與手機後三碼已下過單了，每人每組合限一單");
      }
      const now = firebase.firestore.FieldValue.serverTimestamp();
      tx.set(orderRef, {
        orderKey,
        buyerName: name,
        phoneLast3: phone,
        items: orderItems,
        totalPrice,
        createdBy: currentUser.uid,
        createdAt: now,
        isPaid: false
      });
      // 更新 counters（只寫有下單的品項 + __total + __orders）
      const newCounters = applyOrderCounters(orderItems, counterSnap);
      newCounters.__orders = (counterSnap.__orders || 0) + 1;
      for (const key of ["__total", "__orders", ...orderItems.map(i => i.itemId)]) {
        tx.set(db.collection("fgq_events").doc(currentEventId).collection("counters").doc(key), { sold: newCounters[key] });
      }
      // 註：rate_limits 只在「取消」時寫入（擋取消後 10 秒內重下）；
      //     同組合連刷已由 orderKey 文件 id 唯一性天然阻擋，此處不需寫，避免
      //     transaction 內規則 exists(rate_limits) 看到自己剛寫的 lastOrderAt 而誤擋。
      return true;
    });
    showToast("訂單已送出！");
    selected = {};
    document.getElementById("buyerName").value = "";
    document.getElementById("phoneLast3").value = "";
    await loadCounters();
    render();
  } catch (e) {
    showToast("送出失敗：" + e.message);
  }
  btn.disabled = false; btn.textContent = "送出訂單";
};

window._cancelOrder = async function(orderKey) {
  if (!orderKey) return;
  const o = myOrders.find(x => x.id === orderKey);
  if (!o) return;
  if (!confirm("確定取消「" + o.buyerName + "」的訂單？取消後 10 秒內不能以相同姓名與後三碼重下。")) return;
  try {
    await db.runTransaction(async tx => {
      const orderRef = db.collection("fgq_events").doc(currentEventId).collection("orders").doc(orderKey);
      const orderSnap = await tx.get(orderRef);
      if (!orderSnap.exists) throw new Error("訂單不存在");
      const old = orderSnap.data();
      if (old.createdBy !== currentUser.uid) throw new Error("只能取消自己的訂單");
      const counterSnap = {};
      for (const key of ["__total", "__orders", ...items.map(i => i.id)]) {
        const ref = db.collection("fgq_events").doc(currentEventId).collection("counters").doc(key);
        const snap = await tx.get(ref);
        counterSnap[key] = snap.exists ? (snap.data().sold || 0) : 0;
      }
      let next = releaseOrderCounters(old.items, counterSnap);
      next.__orders = Math.max(0, (next.__orders || 0) - 1);
      tx.delete(orderRef);
      for (const key of ["__total", "__orders", ...old.items.map(i => i.itemId)]) {
        tx.set(db.collection("fgq_events").doc(currentEventId).collection("counters").doc(key), { sold: next[key] });
      }
      // 洗單防護：取消後 10 秒內不可用相同組合重下（保留 rate_limits 並更新時間）
      tx.set(db.collection("fgq_events").doc(currentEventId).collection("rate_limits").doc(orderKey), {
        lastOrderAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return true;
    });
    showToast("訂單已取消");
    selected = {};
    document.getElementById("buyerName").value = "";
    document.getElementById("phoneLast3").value = "";
    await loadCounters();
    render();
  } catch (e) {
    showToast("取消失敗：" + e.message);
  }
};

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML }

init();
</script>
</body>
